<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.webmanifest">
<title>Кооп: прототип сети</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111; color: #eee; font-family: system-ui, sans-serif; touch-action: none; }
  /* dvh = реально видимая высота без панелей Safari; safe-area под Dynamic Island */
  #stage { position: fixed; inset: 0; height: 100dvh; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #game { width: 100%; height: 100%; }
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: rgba(10,10,20,.92); z-index: 10; text-align: center; padding: 16px; }
  .hidden { display: none !important; }
  button { font: inherit; font-size: 18px; border: 0; border-radius: 999px; padding: 10px 22px; background: #e0457b; color: #fff; }
  button:disabled { opacity: .3; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  label { font-size: 17px; display: flex; gap: 8px; align-items: center; }
  input[type=checkbox] { width: 22px; height: 22px; }
  #debug { position: fixed; top: calc(env(safe-area-inset-top) + 4px); left: calc(env(safe-area-inset-left) + 6px); font: 11px/1.3 ui-monospace, monospace; color: #9f9; z-index: 5; pointer-events: none; white-space: pre; text-shadow: 0 0 2px #000; }
  #topbar { position: fixed; top: calc(env(safe-area-inset-top) + 4px); right: calc(env(safe-area-inset-right) + 6px); z-index: 5; display: flex; gap: 6px; }
  #topbar button { font-size: 13px; padding: 6px 12px; }
  .link { font: 14px ui-monospace, monospace; width: min(90vw, 460px); padding: 8px; border-radius: 8px; border: 0; user-select: text; -webkit-user-select: text; text-align: center; }
  .code { font: bold 40px ui-monospace, monospace; letter-spacing: 6px; }
  #codeInput { font: bold 22px ui-monospace, monospace; width: 140px; text-align: center; text-transform: uppercase; padding: 8px; border-radius: 8px; border: 0; user-select: text; -webkit-user-select: text; }
  #err { position: fixed; bottom: 0; left: 0; right: 0; background: #900; color: #fff; font: 12px monospace; z-index: 20; white-space: pre-wrap; padding: 4px; }
  #rotate { display: none; }
  @media (orientation: portrait) { #rotate { display: flex; z-index: 30; } }
</style>
</head>
<body>
<div id="stage"><div id="game"></div></div>
<div id="debug"></div>
<div id="topbar" class="hidden">
  <button id="pauseBtn">⏸ Пауза</button>
  <button id="share" class="hidden">Позвать друга</button>
</div>

<div id="menu" class="overlay">
  <h2 style="margin:0">Прототип мультиплеера</h2>
  <label><input type="checkbox" id="online" checked> Онлайн-режим</label>
  <div class="row"><button id="start">Новая игра</button></div>
  <div class="row" id="joinRow"><input id="codeInput" maxlength="5" placeholder="КОД" autocomplete="off" autocapitalize="characters"><button id="joinBtn">Войти по коду</button></div>
  <div id="menuNote" style="font-size:13px;opacity:.7"></div>
</div>

<div id="picker" class="overlay hidden">
  <h3 style="margin:0">Кем играешь?</h3>
  <div class="row" id="chars"></div>
  <div id="pickNote" style="font-size:13px;opacity:.7"></div>
</div>

<div id="pauseBox" class="overlay hidden">
  <h2 style="margin:0">Пауза</h2>
  <div id="pauseNote" style="font-size:14px;opacity:.7"></div>
  <button id="resumeBtn">Продолжить</button>
</div>

<div id="shareBox" class="overlay hidden">
  <div>Код комнаты</div>
  <div class="code" id="shareCode"></div>
  <input class="link" id="shareLink" readonly>
  <div class="row">
    <button id="copyBtn">Скопировать</button>
    <button id="nativeShareBtn" class="hidden">Поделиться</button>
    <button id="closeShareBtn" style="background:#555">Закрыть</button>
  </div>
  <div style="font-size:13px;opacity:.7">Друг открывает ссылку или вводит код на стартовом экране</div>
</div>
<div id="rotate" class="overlay">Поверни телефон горизонтально</div>
<div id="err" class="hidden"></div>

<script type="module" src="./src/main.ts"></script>
</body>
</html>
