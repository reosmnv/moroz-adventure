<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Тест вибрации</title>
<style>body{font:18px system-ui;padding:20px}button{font-size:22px;padding:16px 24px;margin:8px 0;display:block}</style>
<p id="s"></p>
<button id="a">1. navigator.vibrate(200)</button>
<label>2. Переключатель-хак (iOS 17.4+): <input type="checkbox" switch id="sw"></label>
<p id="r">Нажмите кнопку 1 или коснитесь переключателя 2 и скажите, почувствовали ли вибрацию.</p>
<script>
s.textContent = "'vibrate' in navigator: " + ('vibrate' in navigator);
a.onclick = () => { r.textContent = 'vibrate вернул: ' + (navigator.vibrate ? navigator.vibrate(200) : 'нет API'); };
sw.onchange = () => { r.textContent = 'переключатель сработал'; };
</script>
